<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI — Stark Mark VII Multilingual Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020610;
            --surface: rgba(10, 18, 32, 0.85);
            --surface-border: rgba(0, 240, 255, 0.3);
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.6);
            --accent-gold: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(0, 240, 255, 0.15) 0%, transparent 65%),
                linear-gradient(180deg, #020610 0%, #010307 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 2rem;
        }

        /* Background Holographic Grid Animation */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* HUD Header Top */
        .hud-header {
            width: 100%;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            background: rgba(2, 6, 16, 0.6);
            backdrop-filter: blur(10px);
        }

        .hud-brand {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .hud-metrics {
            display: flex;
            gap: 1.5rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            color: #38bdf8;
        }

        .metric-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .metric-val {
            color: var(--accent);
            font-weight: 700;
        }

        /* Status Badge */
        .status-badge {
            background: var(--surface);
            backdrop-filter: blur(12px);
            padding: 0.45rem 1.4rem;
            border-radius: 999px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid var(--surface-border);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
            z-index: 10;
        }

        .status-badge:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .dot.live {
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
        }

        .dot.speaking {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .dot.error {
            background: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        /* Arc Reactor & Visualizer Canvas Wrapper */
        .reactor-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            margin-bottom: 1rem;
            z-index: 10;
        }

        #visualizerCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .arc-reactor-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #020712;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.6), inset 0 0 25px rgba(0, 240, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
            overflow: hidden;
            position: relative;
        }

        .arc-reactor-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.9));
            transition: filter 0.3s, transform 0.3s;
            animation: reactor-spin 30s linear infinite;
        }

        @keyframes reactor-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .arc-reactor-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px rgba(0, 240, 255, 0.9), inset 0 0 40px rgba(0, 240, 255, 0.6);
        }

        .arc-reactor-btn.active {
            border-color: #fca5a5;
            box-shadow: 0 0 75px rgba(239, 68, 68, 0.95), inset 0 0 40px rgba(239, 68, 68, 0.6);
            transform: scale(1.06);
        }

        .arc-reactor-btn.active .arc-reactor-img {
            filter: drop-shadow(0 0 28px rgba(239, 68, 68, 1)) hue-rotate(130deg);
        }

        /* Quick Action Chips */
        .chips-container {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            max-width: 600px;
            margin-bottom: 0.8rem;
            z-index: 10;
        }

        .chip {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: #38bdf8;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Terminal Display Container */
        .transcript-container {
            width: 90%;
            max-width: 620px;
            height: 280px;
            background: var(--surface);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            padding: 1.25rem;
            overflow-y: auto;
            border: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .transcript-container::-webkit-scrollbar {
            width: 6px;
        }
        .transcript-container::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 3px;
        }

        .input-bar {
            width: 90%;
            max-width: 620px;
            display: flex;
            gap: 0.6rem;
            margin-top: 0.85rem;
            z-index: 10;
        }

        .text-input {
            flex: 1;
            padding: 0.85rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
            background: rgba(4, 9, 18, 0.95);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .text-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .btn-send {
            padding: 0.85rem 1.6rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
            color: #020610;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn-send:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            padding: 0.75rem 1.1rem;
            border-radius: 12px;
            max-width: 85%;
            width: fit-content;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            align-self: flex-end;
            color: #f1f5f9;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            align-self: flex-start;
            color: #38bdf8;
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .system-msg {
            align-self: center;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .tool-card {
            align-self: center;
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed var(--success);
            color: #34d399;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            width: 95%;
            box-sizing: border-box;
            white-space: pre-wrap;
        }

        /* Modal Setup Overlay */
        .setup-modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 16, 0.96);
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .setup-modal.hidden {
            display: none;
        }

        .modal-card {
            background: rgba(10, 18, 32, 0.95);
            border: 1px solid var(--surface-border);
            padding: 2.5rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.2);
            max-width: 440px;
            width: 90%;
        }

        .api-input, .voice-select {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--surface-border);
            background: #040912;
            color: white;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .api-input:focus, .voice-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .btn-start {
            padding: 0.95rem 2rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
            color: #020610;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.75);
        }
    </style>
</head>

<body>

    <div id="setupModal" class="setup-modal">
        <div class="modal-card">
            <h2 style="font-family: 'Orbitron', sans-serif; margin: 0 0 0.4rem 0; color: var(--accent); font-size: 1.7rem; letter-spacing: 2px;">⚡ J.A.R.V.I.S. AI</h2>
            <p style="font-family: 'Roboto Mono', monospace; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 1.5rem; letter-spacing: 1px;">STARK MARK VII REAL-TIME ASSISTANT PROTOCOL</p>
            
            <input type="password" id="apiKey" class="api-input" placeholder="Enter Gemini API Key (AIza...)">

            <select id="modelSelect" class="voice-select">
                <option value="models/gemini-2.0-flash-exp" selected>🧠 Model: Gemini 2.0 Flash Exp (Recommended)</option>
                <option value="models/gemini-2.0-flash-realtime-exp">🧠 Model: Gemini 2.0 Flash Realtime Exp</option>
            </select>

            <select id="langSelect" class="voice-select">
                <option value="Haryanvi" selected>🌐 Language: Haryanvi (हरियाणवी & English Mix)</option>
                <option value="English">🌐 Language: English (Refined British J.A.R.V.I.S.)</option>
                <option value="Hinglish">🌐 Language: Hinglish (Hindi + English)</option>
            </select>

            <select id="voiceSelect" class="voice-select">
                <option value="Charon" selected>🎙️ Voice: Charon (J.A.R.V.I.S. Deep Male)</option>
                <option value="Puck">🎙️ Voice: Puck (Energetic Male)</option>
                <option value="Fenrir">🎙️ Voice: Fenrir (Resonant Male)</option>
                <option value="Aoede">🎙️ Voice: Aoede (Warm Female)</option>
                <option value="Kore">🎙️ Voice: Kore (Calm Female)</option>
            </select>

            <div style="display: flex; gap: 0.5rem; width: 100%; margin-bottom: 1rem;">
                <button id="testVoiceBtn" type="button" style="flex: 1; padding: 0.75rem; border-radius: 10px; background: rgba(0,240,255,0.15); border: 1px solid var(--accent); color: var(--accent); font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer;">🔊 TEST VOICE</button>
            </div>

            <button id="startSessionBtn" class="btn-start">INITIALIZE J.A.R.V.I.S.</button>
        </div>
    </div>

    <div class="hud-header">
        <h1 class="hud-brand">
            <span>⚡</span> J.A.R.V.I.S.
        </h1>
        <div class="hud-metrics">
            <div class="metric-box">
                <span style="opacity:0.6;">SYSTEM CLOCK</span>
                <span class="metric-val" id="clockDisplay">15:41 IST</span>
            </div>
            <div class="metric-box">
                <span style="opacity:0.6;">NEURAL CORE</span>
                <span class="metric-val">3.9 GHz / 24kHz</span>
            </div>
        </div>
    </div>

    <div class="status-badge" id="statusBadge" title="Click to configure settings or reconnect">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">SYSTEM STANDBY</span>
        <span style="font-size: 0.75rem; opacity: 0.6; margin-left: 0.3rem;">⚙️</span>
    </div>

    <div class="reactor-wrapper">
        <canvas id="visualizerCanvas" width="260" height="260"></canvas>
        <button class="arc-reactor-btn" id="callBtn" title="Activate J.A.R.V.I.S. Arc Reactor">
            <img src="arc_reactor.png" alt="Arc Reactor Core" class="arc-reactor-img">
        </button>
    </div>

    <div class="chips-container">
        <div class="chip" onclick="quickSend('Ram Ram Jarvis, Kisa hai bhai?')">⚡ Ram Ram Jarvis!</div>
        <div class="chip" onclick="quickSend('Check my calendar schedule for today.')">📅 Check Schedule</div>
        <div class="chip" onclick="quickSend('Book a meeting titled Stark Project Review today at 5 PM with Stark Team.')">🎙️ Book Meeting</div>
        <div class="chip" onclick="quickSend('What can you do for me, Jarvis?')">🤖 Capabilities</div>
    </div>

    <div class="transcript-container" id="transcript">
        <div class="message system-msg">[SYSTEM] Awaiting user initialization. Click status badge ⚙️ to configure.</div>
    </div>

    <div class="input-bar">
        <input type="text" id="textInput" class="text-input" placeholder="Type a command or tap Arc Reactor to speak...">
        <button id="sendBtn" class="btn-send">SEND</button>
    </div>

    <script>
        const UI = {
            setupModal: document.getElementById('setupModal'),
            startBtn: document.getElementById('startSessionBtn'),
            testVoiceBtn: document.getElementById('testVoiceBtn'),
            apiKeyInput: document.getElementById('apiKey'),
            modelSelect: document.getElementById('modelSelect'),
            langSelect: document.getElementById('langSelect'),
            voiceSelect: document.getElementById('voiceSelect'),
            callBtn: document.getElementById('callBtn'),
            statusBadge: document.getElementById('statusBadge'),
            statusText: document.getElementById('statusText'),
            statusDot: document.getElementById('statusDot'),
            transcript: document.getElementById('transcript'),
            textInput: document.getElementById('textInput'),
            sendBtn: document.getElementById('sendBtn'),
            clockDisplay: document.getElementById('clockDisplay')
        };

        let isCallActive = false;
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptProcessor = null;
        let nextPlayTime = 0;
        let audioPlayedInTurn = false;
        let currentTurnText = "";

        let activeBubble = null;
        let activeRole = null;
        let activeSources = [];

        let micAnalyser = null;
        let aiAnalyser = null;
        let canvas = document.getElementById('visualizerCanvas');
        let canvasCtx = canvas ? canvas.getContext('2d') : null;
        let animFrameId = null;

        // Clock display update
        function updateClock() {
            const now = new Date();
            if (UI.clockDisplay) {
                UI.clockDisplay.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + " IST";
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Auto-load saved API key if present
        const savedKey = localStorage.getItem('jarvis_api_key');
        if (savedKey) {
            UI.apiKeyInput.value = savedKey;
        }

        if (UI.statusBadge) {
            UI.statusBadge.addEventListener('click', () => {
                UI.setupModal.classList.remove('hidden');
            });
        }

        let synthVoices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                aiAnalyser = audioContext.createAnalyser();
                aiAnalyser.fftSize = 256;
                aiAnalyser.connect(audioContext.destination);
                startCanvasVisualizer();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
            return audioContext;
        }

        function unlockAudio() {
            getAudioContext();
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
        }
        window.addEventListener('click', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);

        function speakTextFallback(text) {
            if (!('speechSynthesis' in window) || !text || !text.trim()) return;
            try {
                window.speechSynthesis.cancel();
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 0.95;

                if (synthVoices.length === 0) {
                    synthVoices = window.speechSynthesis.getVoices();
                }

                const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
                let preferredVoice = null;

                if (selectedLang === "English") {
                    preferredVoice = synthVoices.find(v => v.name.includes("UK") || v.name.includes("British") || v.name.includes("David") || v.name.includes("George") || v.lang.includes("en-GB"));
                } else {
                    preferredVoice = synthVoices.find(v => v.lang.includes("hi-IN") || v.name.includes("Hindi") || v.name.includes("Google हिन्दी"));
                }

                if (!preferredVoice) {
                    preferredVoice = synthVoices.find(v => v.lang.startsWith("en"));
                }

                if (preferredVoice) utterance.voice = preferredVoice;

                utterance.onstart = () => setSpeakingState(true);
                utterance.onend = () => setSpeakingState(false);
                utterance.onerror = () => setSpeakingState(false);

                window.speechSynthesis.speak(utterance);
            } catch (err) {
                console.error("SpeechSynthesis error:", err);
            }
        }

        if (UI.testVoiceBtn) {
            UI.testVoiceBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                unlockAudio();
                const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
                const testMsg = selectedLang === "Haryanvi" 
                    ? "राम राम भाई! J.A.R.V.I.S. voice systems operational." 
                    : "J.A.R.V.I.S. online. Spoken voice systems functioning properly, Sir.";
                speakTextFallback(testMsg);
            });
        }

        function startCanvasVisualizer() {
            if (!canvasCtx) return;
            const micData = new Uint8Array(128);
            const aiData = new Uint8Array(128);

            function render() {
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                let level = 0;
                if (micAnalyser && isCallActive) {
                    micAnalyser.getByteFrequencyData(micData);
                    level = micData.reduce((a, b) => a + b, 0) / micData.length;
                } else if (aiAnalyser) {
                    aiAnalyser.getByteFrequencyData(aiData);
                    level = aiData.reduce((a, b) => a + b, 0) / aiData.length;
                }

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 80 + (level / 255) * 20;

                canvasCtx.beginPath();
                canvasCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                canvasCtx.strokeStyle = level > 10 ? '#00f0ff' : 'rgba(0, 240, 255, 0.25)';
                canvasCtx.lineWidth = 3;
                canvasCtx.shadowBlur = level > 10 ? 20 : 5;
                canvasCtx.shadowColor = '#00f0ff';
                canvasCtx.stroke();

                animFrameId = requestAnimationFrame(render);
            }
            render();
        }

        UI.startBtn.addEventListener('click', () => {
            unlockAudio();
            const key = UI.apiKeyInput.value.trim();
            const selectedModel = UI.modelSelect ? UI.modelSelect.value : "models/gemini-2.0-flash-exp";
            const selectedVoice = UI.voiceSelect ? UI.voiceSelect.value : "Charon";
            const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
            if (!key) return alert("API Key is required to power J.A.R.V.I.S.");

            localStorage.setItem('jarvis_api_key', key);

            if (ws) {
                try { ws.close(); } catch(e){}
            }

            UI.setupModal.classList.add('hidden');
            updateStatus('CONNECTING...', 'speaking');
            addMessage('[SYSTEM] Establishing neural link to J.A.R.V.I.S. core...', 'system-msg');

            const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${key}`;
            ws = new WebSocket(wsUrl);

            ws.onerror = (err) => {
                console.error("WebSocket Error:", err);
                updateStatus('CONNECTION ERROR', 'error');
                addMessage('[ERROR] Could not connect to Gemini Live API. Please verify your API Key & Internet connection.', 'system-msg');
            };

            ws.onclose = (e) => {
                console.warn("WebSocket Closed:", e);
                updateStatus('DISCONNECTED', 'muted');
                const reasonStr = e.reason ? ` (${e.reason})` : '';
                addMessage(`[SYSTEM] Connection closed (Code ${e.code}${reasonStr}). Click status badge ⚙️ to enter key & reconnect.`, 'system-msg');
            };

            ws.onopen = () => {
                updateStatus('J.A.R.V.I.S. ONLINE', 'live');
                const welcomeMsg = `Online and at your service, Sir (${selectedLang} language, ${selectedVoice} voice). Tap Arc Reactor or select a quick command below.`;
                addMessage(`[J.A.R.V.I.S.] ${welcomeMsg}`, 'system-msg');
                speakTextFallback(welcomeMsg);

                const currentDate = new Date().toString();
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

                let systemPrompt = "";

                if (selectedLang === "Haryanvi") {
                    systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Haryanvi (हरियाणवी), Hindi, and English.
                    
                    PERSONALITY & LANGUAGE INSTRUCTIONS:
                    1. Respond in natural, authentic, polite, and witty Haryanvi (हरियाणवी बोली) mixed with clear English terms when appropriate. Use respectful Haryanvi terms like 'भाई', 'साहब', 'जी' naturally.
                    2. Maintain J.A.R.V.I.S.'s signature intelligence, confidence, and eager-to-help demeanor.
                    3. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    4. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking to prevent double-booking. When booking or checking, format dates strictly to ISO 8601 offset to the user's timezone.
                    5. Keep spoken responses concise, witty, and voice-optimized in Haryanvi.`;
                } else if (selectedLang === "Hinglish") {
                    systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Hinglish (Hindi + English).
                    
                    PERSONALITY & LANGUAGE INSTRUCTIONS:
                    1. Speak in smooth, natural Hinglish (Hindi mixed with English) with a polite, intelligent, and witty tone. Use 'Sir' or 'Ji' respectfully.
                    2. Maintain J.A.R.V.I.S.'s signature confidence and helpful demeanor.
                    3. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    4. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking.
                    5. Keep spoken responses concise and voice-optimized in Hinglish.`;
                } else {
                    systemPrompt = `You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), an elite, highly sophisticated AI voice assistant.
                    
                    PERSONALITY & VOICE INSTRUCTIONS:
                    1. Always address the user respectfully and naturally as 'Sir' (or 'Ma'am' if appropriate).
                    2. Speak in a refined British accent tone: calm, composed, immensely intelligent, articulate, and subtly witty with dry humor.
                    3. Always remain polite, efficient, and eager to assist with utmost precision.
                    4. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    5. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking to prevent double-booking.
                    6. Keep spoken responses concise, elegant, and voice-optimized.`;
                }

                ws.send(JSON.stringify({
                    setup: {
                        model: selectedModel,
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } }
                        },
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        tools: [{
                            functionDeclarations: [
                                {
                                    name: "check_availability",
                                    description: "Checks the user's calendar for busy slots on a given day.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            date: { type: "STRING", description: "ISO 8601 date to check (e.g., 2026-05-26T00:00:00+05:30)" }
                                        },
                                        required: ["date"]
                                    }
                                },
                                {
                                    name: "book_meeting",
                                    description: "Schedules a meeting on the calendar.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            title: { type: "STRING", description: "Meeting title" },
                                            date_time: { type: "STRING", description: "ISO 8601 date and time (e.g., 2026-05-26T09:00:00+05:30)" },
                                            guest_email: { type: "STRING", description: "Guest email address" }
                                        },
                                        required: ["title", "date_time", "guest_email"]
                                    }
                                }
                            ]
                        }]
                    }
                }));
            };

            ws.onmessage = async (event) => {
                try {
                    let rawText = "";
                    if (typeof event.data === "string") {
                        rawText = event.data;
                    } else if (event.data instanceof Blob) {
                        rawText = await event.data.text();
                    } else if (event.data instanceof ArrayBuffer) {
                        rawText = new TextDecoder().decode(event.data);
                    }

                    const msg = JSON.parse(rawText);

                    if (msg.error) {
                        console.error("Gemini API Error:", msg.error);
                        updateStatus('API ERROR', 'error');
                        const errMsg = msg.error.message || JSON.stringify(msg.error);
                        addMessage(`[ERROR] Gemini API Error: ${errMsg}`, 'system-msg');
                        speakTextFallback(`API Error: ${errMsg}`);
                        return;
                    }

                    if (msg.toolCall) {
                        const functionCalls = msg.toolCall.functionCalls;
                        const responses = [];

                        for (const call of functionCalls) {
                            const args = call.args;
                            console.log("🎯 Tool Triggered:", call.name, args);

                            let endpoint = "";
                            let visualOutput = "";

                            if (call.name === "book_meeting") {
                                endpoint = "http://127.0.0.1:5000/api/book_meeting";
                                visualOutput = `⚙️ J.A.R.V.I.S. Action: book_meeting()\n↳ Title: ${args.title}\n↳ Time: ${args.date_time}`;
                            } else if (call.name === "check_availability") {
                                endpoint = "http://127.0.0.1:5000/api/check_availability";
                                visualOutput = `🔍 J.A.R.V.I.S. Action: check_availability()\n↳ Date: ${args.date}`;
                            }

                            addToolCard(visualOutput);

                            try {
                                const res = await fetch(endpoint, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(args)
                                });
                                const data = await res.json();
                                responses.push({ id: call.id, name: call.name, response: { output: data.result } });
                            } catch (error) {
                                console.error("Backend Error:", error);
                                responses.push({ id: call.id, name: call.name, response: { output: "Error connected to local Python API." } });
                            }
                        }

                        ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
                    }

                    if (msg.serverContent) {
                        const content = msg.serverContent;

                        if (content.interrupted) {
                            setSpeakingState(false);
                            const ctx = getAudioContext();
                            nextPlayTime = ctx.currentTime;
                            activeBubble = null;
                            activeSources.forEach(source => { try { source.stop(); } catch (e) { } });
                            activeSources = [];
                            audioPlayedInTurn = false;
                            currentTurnText = "";
                        }

                        if (content.inputTranscription && content.inputTranscription.text) {
                            addMessage(content.inputTranscription.text + " ", 'user-msg', true);
                        }

                        if (content.outputTranscription && content.outputTranscription.text) {
                            setSpeakingState(true);
                            addMessage(content.outputTranscription.text, 'ai-msg', true);
                            currentTurnText += content.outputTranscription.text;
                        }

                        if (content.modelTurn && content.modelTurn.parts) {
                            for (const part of content.modelTurn.parts) {
                                if (part.inlineData && part.inlineData.data) {
                                    const played = playAudioBase64(part.inlineData.data);
                                    if (played) audioPlayedInTurn = true;
                                }
                                if (part.text) {
                                    setSpeakingState(true);
                                    addMessage(part.text, 'ai-msg', true);
                                    currentTurnText += part.text;
                                }
                            }
                        }

                        if (content.turnComplete) {
                            if (!audioPlayedInTurn && currentTurnText.trim().length > 0) {
                                speakTextFallback(currentTurnText);
                            }
                            activeBubble = null;
                            currentTurnText = "";
                            audioPlayedInTurn = false;
                        }
                    }
                } catch (parseError) {
                    console.error("Error handling WS message:", parseError);
                }
            };
        });

        function sendTextMessage() {
            unlockAudio();
            const text = UI.textInput.value.trim();
            if (!text) return;

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('[SYSTEM] Connection not active. Click status badge ⚙️ to enter API key & connect.', 'system-msg');
                UI.setupModal.classList.remove('hidden');
                return;
            }

            addMessage(text, 'user-msg');
            UI.textInput.value = '';
            audioPlayedInTurn = false;
            currentTurnText = "";

            ws.send(JSON.stringify({
                clientContent: {
                    turns: [
                        { role: "user", parts: [{ text: text }] }
                    ],
                    turnComplete: true
                }
            }));
        }

        function quickSend(txt) {
            UI.textInput.value = txt;
            sendTextMessage();
        }

        UI.sendBtn.addEventListener('click', sendTextMessage);
        UI.textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        UI.callBtn.addEventListener('click', async () => {
            unlockAudio();
            isCallActive = !isCallActive;

            if (isCallActive) {
                UI.callBtn.classList.add('active');
                updateStatus('LISTENING...', 'live');
                addMessage('[J.A.R.V.I.S.] Arc Reactor active. Audio sensors listening, Sir.', 'system-msg');

                try {
                    const ctx = getAudioContext();
                    nextPlayTime = ctx.currentTime;

                    micAnalyser = ctx.createAnalyser();
                    micAnalyser.fftSize = 256;

                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true }
                    });

                    const source = ctx.createMediaStreamSource(mediaStream);
                    source.connect(micAnalyser);

                    scriptProcessor = ctx.createScriptProcessor(1024, 1, 1);
                    scriptProcessor.onaudioprocess = (e) => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            const float32Data = e.inputBuffer.getChannelData(0);
                            ws.send(JSON.stringify({
                                realtimeInput: {
                                    mediaChunks: [
                                        { mimeType: "audio/pcm;rate=16000", data: float32ToBase64(float32Data) }
                                    ]
                                }
                            }));
                        }
                    };

                    source.connect(scriptProcessor);
                    scriptProcessor.connect(ctx.destination);

                } catch (err) {
                    console.error("Microphone access error:", err);
                    isCallActive = false;
                    UI.callBtn.classList.remove('active');
                    updateStatus('J.A.R.V.I.S. ONLINE', 'live');
                    addMessage('[ERROR] Could not access microphone. Please check browser permissions.', 'system-msg');
                }
            } else {
                UI.callBtn.classList.remove('active');
                updateStatus('J.A.R.V.I.S. ONLINE', 'live');

                if (scriptProcessor) scriptProcessor.disconnect();
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            }
        });

        function float32ToBase64(float32Array) {
            let buffer = new ArrayBuffer(float32Array.length * 2);
            let view = new DataView(buffer);
            for (let i = 0; i < float32Array.length; i++) {
                let s = Math.max(-1, Math.min(1, float32Array[i]));
                view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            let binary = '';
            let bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
            return btoa(binary);
        }

        function playAudioBase64(base64) {
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }

                let binary = atob(base64);
                let buffer = new ArrayBuffer(binary.length);
                let view = new DataView(buffer);
                for (let i = 0; i < binary.length; i++) { view.setUint8(i, binary.charCodeAt(i)); }

                let byteLen = buffer.byteLength - (buffer.byteLength % 2);
                if (byteLen <= 0) return false;

                const int16Array = new Int16Array(buffer, 0, byteLen / 2);
                const audioBuffer = ctx.createBuffer(1, int16Array.length, 24000);
                const channelData = audioBuffer.getChannelData(0);

                for (let i = 0; i < int16Array.length; i++) { channelData[i] = int16Array[i] / 32768.0; }

                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;

                if (aiAnalyser) {
                    source.connect(aiAnalyser);
                } else {
                    source.connect(ctx.destination);
                }

                const startTime = Math.max(ctx.currentTime, nextPlayTime);
                source.start(startTime);
                nextPlayTime = startTime + audioBuffer.duration;

                activeSources.push(source);
                setSpeakingState(true);

                source.onended = () => {
                    activeSources = activeSources.filter(s => s !== source);
                    if (activeSources.length === 0) {
                        setSpeakingState(false);
                    }
                };
                return true;
            } catch (err) {
                console.error("Error playing audio chunk:", err);
                return false;
            }
        }

        function updateStatus(text, dotClass) {
            UI.statusText.innerText = text; UI.statusDot.className = `dot ${dotClass}`;
        }
        function addToolCard(text) {
            const card = document.createElement('pre'); card.className = 'tool-card'; card.innerText = text;
            UI.transcript.appendChild(card); UI.transcript.scrollTop = UI.transcript.scrollHeight;
            activeBubble = null; activeRole = null;
        }
        function setSpeakingState(isSpeaking) {
            if (isSpeaking) {
                updateStatus('J.A.R.V.I.S. SPEAKING', 'speaking');
            } else {
                if (isCallActive) {
                    updateStatus('LISTENING...', 'live');
                } else {
                    updateStatus('J.A.R.V.I.S. ONLINE', 'live');
                }
            }
        }
        function addMessage(text, typeClass, isChunk = false) {
            if (isChunk) {
                if (activeBubble && activeRole === typeClass) {
                    activeBubble.innerText += text; UI.transcript.scrollTop = UI.transcript.scrollHeight; return;
                }
                activeBubble = document.createElement('div'); activeBubble.className = `message ${typeClass}`; activeBubble.innerText = text;
                UI.transcript.appendChild(activeBubble); activeRole = typeClass;
            } else {
                const msg = document.createElement('div'); msg.className = `message ${typeClass}`; msg.innerText = text;
                UI.transcript.appendChild(msg); activeBubble = null; activeRole = null;
            }
            UI.transcript.scrollTop = UI.transcript.scrollHeight;
        }
    </script>
</body>
