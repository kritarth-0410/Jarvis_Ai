<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI — Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a12;
            --surface: rgba(14, 23, 38, 0.85);
            --surface-border: rgba(0, 240, 255, 0.25);
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.6);
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, #050a12 0%, #03070d 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hud-header {
            position: absolute;
            top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            text-align: center;
        }

        .hud-brand {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .hud-sub {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.85;
        }

        .status-badge {
            position: absolute;
            top: 5.5rem;
            background: var(--surface);
            backdrop-filter: blur(12px);
            padding: 0.4rem 1.2rem;
            border-radius: 999px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid var(--surface-border);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            cursor: pointer;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .dot.live {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .dot.speaking {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        .orb-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5rem;
            margin-bottom: 1.5rem;
        }

        .arc-reactor-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #030812;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
            overflow: hidden;
            position: relative;
        }

        .arc-reactor-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8));
            transition: filter 0.3s, transform 0.3s;
            animation: reactor-slow-spin 25s linear infinite;
        }

        @keyframes reactor-slow-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .arc-reactor-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 55px rgba(0, 240, 255, 0.85), inset 0 0 35px rgba(0, 240, 255, 0.5);
        }

        .arc-reactor-btn:hover .arc-reactor-img {
            filter: drop-shadow(0 0 18px rgba(0, 240, 255, 1));
        }

        .arc-reactor-btn.active {
            border-color: #fca5a5;
            box-shadow: 0 0 55px rgba(239, 68, 68, 0.9);
            transform: scale(var(--mic-scale, 1));
        }

        .arc-reactor-btn.active .arc-reactor-img {
            filter: drop-shadow(0 0 22px rgba(239, 68, 68, 1)) hue-rotate(130deg);
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 25px var(--accent-glow);
            transform: scale(var(--ai-scale, 1));
            transition: transform 0.05s ease-out, opacity 0.1s;
        }

        .speaking-mode .ring {
            opacity: 0.85;
            animation: pulse-ring 2s infinite linear;
        }

        @keyframes pulse-ring {
            0% { border-color: #00f0ff; }
            50% { border-color: #38bdf8; }
            100% { border-color: #00f0ff; }
        }

        .transcript-container {
            width: 90%;
            max-width: 540px;
            height: 260px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 1.25rem;
            overflow-y: auto;
            border: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .input-bar {
            width: 90%;
            max-width: 540px;
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .text-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--surface-border);
            background: rgba(6, 11, 19, 0.9);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
        }

        .text-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-send {
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            background: var(--accent);
            color: #03070d;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #38bdf8;
        }

        .message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            padding: 0.75rem 1.1rem;
            border-radius: 12px;
            max-width: 85%;
            width: fit-content;
            word-wrap: break-word;
        }

        .user-msg {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            align-self: flex-end;
            color: #f1f5f9;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            align-self: flex-start;
            color: #38bdf8;
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .system-msg {
            align-self: center;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .tool-card {
            align-self: center;
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed var(--success);
            color: #34d399;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            width: 90%;
            box-sizing: border-box;
            white-space: pre-wrap;
        }

        .setup-modal {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 13, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .setup-modal.hidden {
            display: none;
        }

        .modal-card {
            background: rgba(14, 23, 38, 0.9);
            border: 1px solid var(--surface-border);
            padding: 2.5rem;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
            max-width: 400px;
            width: 90%;
        }

        .api-input, .voice-select {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--surface-border);
            background: #060b13;
            color: white;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .api-input:focus, .voice-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-start {
            padding: 0.9rem 2rem;
            border-radius: 10px;
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
            color: #03070d;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.7);
        }
    </style>
</head>

<body>

    <div id="setupModal" class="setup-modal">
        <div class="modal-card">
            <h2 style="font-family: 'Orbitron', sans-serif; margin: 0 0 0.4rem 0; color: var(--accent); font-size: 1.6rem; letter-spacing: 2px;">⚡ J.A.R.V.I.S.</h2>
            <p style="font-family: 'Roboto Mono', monospace; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 1.5rem; letter-spacing: 1px;">REAL-TIME VOICE ASSISTANT</p>
            
            <input type="password" id="apiKey" class="api-input" placeholder="Enter Gemini API Key (AIza...)">
            
            <select id="langSelect" class="voice-select">
                <option value="Haryanvi" selected>🌐 Language: Haryanvi (हरियाणवी & English Mix)</option>
                <option value="English">🌐 Language: English (Refined British J.A.R.V.I.S.)</option>
                <option value="Hinglish">🌐 Language: Hinglish (Hindi + English)</option>
            </select>

            <select id="voiceSelect" class="voice-select">
                <option value="Charon" selected>🎙️ Voice: Charon (J.A.R.V.I.S. Deep Male)</option>
                <option value="Puck">🎙️ Voice: Puck (Energetic Male)</option>
                <option value="Fenrir">🎙️ Voice: Fenrir (Resonant Male)</option>
                <option value="Aoede">🎙️ Voice: Aoede (Warm Female)</option>
                <option value="Kore">🎙️ Voice: Kore (Calm Female)</option>
            </select>

            <button id="startSessionBtn" class="btn-start">INITIALIZE J.A.R.V.I.S.</button>
        </div>
    </div>

    <div class="hud-header">
        <h1 class="hud-brand">
            <span>⚡</span> J.A.R.V.I.S.
        </h1>
        <span class="hud-sub">Real-Time Voice Assistant Protocol</span>
    </div>

    <div class="status-badge" id="statusBadge" title="Click to change settings or reconnect">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">SYSTEM STANDBY</span>
    </div>

    <div class="orb-container" id="orbContainer">
        <div class="ring"></div>
        <button class="arc-reactor-btn" id="callBtn" title="Activate J.A.R.V.I.S. Arc Reactor">
            <img src="arc_reactor.png" alt="Arc Reactor Core" class="arc-reactor-img">
        </button>
    </div>

    <div class="transcript-container" id="transcript">
        <div class="message system-msg">[SYSTEM] Awaiting user initialization...</div>
    </div>

    <div class="input-bar">
        <input type="text" id="textInput" class="text-input" placeholder="Type a message or press Arc Reactor to speak...">
        <button id="sendBtn" class="btn-send">SEND</button>
    </div>

    <script>
        const UI = {
            setupModal: document.getElementById('setupModal'),
            startBtn: document.getElementById('startSessionBtn'),
            apiKeyInput: document.getElementById('apiKey'),
            langSelect: document.getElementById('langSelect'),
            voiceSelect: document.getElementById('voiceSelect'),
            callBtn: document.getElementById('callBtn'),
            statusBadge: document.getElementById('statusBadge'),
            statusText: document.getElementById('statusText'),
            statusDot: document.getElementById('statusDot'),
            transcript: document.getElementById('transcript'),
            orbContainer: document.getElementById('orbContainer'),
            textInput: document.getElementById('textInput'),
            sendBtn: document.getElementById('sendBtn')
        };

        let isCallActive = false;
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptProcessor = null;
        let nextPlayTime = 0;
        let audioPlayedInTurn = false;
        let currentTurnText = "";

        let activeBubble = null;
        let activeRole = null;
        let activeSources = [];

        let micAnalyser = null;
        let aiAnalyser = null;
        let visualizerId = null;

        // Auto-load saved API key if present
        const savedKey = localStorage.getItem('jarvis_api_key');
        if (savedKey) {
            UI.apiKeyInput.value = savedKey;
        }

        if (UI.statusBadge) {
            UI.statusBadge.addEventListener('click', () => {
                UI.setupModal.classList.remove('hidden');
            });
        }

        let synthVoices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                aiAnalyser = audioContext.createAnalyser();
                aiAnalyser.fftSize = 256;
                aiAnalyser.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
            return audioContext;
        }

        function unlockAudio() {
            getAudioContext();
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
        }
        window.addEventListener('click', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);

        function speakTextFallback(text) {
            if (!('speechSynthesis' in window) || !text || !text.trim()) return;
            try {
                window.speechSynthesis.cancel();
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 0.95;

                if (synthVoices.length === 0) {
                    synthVoices = window.speechSynthesis.getVoices();
                }

                const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
                let preferredVoice = null;

                // Priority 1: British / J.A.R.V.I.S. Male Voice
                if (selectedLang === "English") {
                    preferredVoice = synthVoices.find(v => v.name.includes("UK Male") || v.name.includes("David") || v.name.includes("George") || v.name.includes("British Male") || v.name.includes("Google UK English Male") || v.lang.includes("en-GB"));
                }
                
                // Priority 2: Indian / Hindi / Haryanvi Voice
                if (!preferredVoice && (selectedLang === "Haryanvi" || selectedLang === "Hinglish")) {
                    preferredVoice = synthVoices.find(v => v.name.includes("Madhur") || v.name.includes("Swara") || v.name.includes("Google हिन्दी") || v.lang.includes("hi-IN"));
                }

                // Priority 3: Any Natural Male Voice
                if (!preferredVoice) {
                    preferredVoice = synthVoices.find(v => (v.name.includes("Natural") || v.name.includes("Neural") || v.name.includes("Male")) && (v.lang.includes("en") || v.lang.includes("hi")));
                }

                if (!preferredVoice) {
                    preferredVoice = synthVoices.find(v => v.lang.startsWith("en"));
                }

                if (preferredVoice) utterance.voice = preferredVoice;

                utterance.onstart = () => setSpeakingState(true);
                utterance.onend = () => setSpeakingState(false);
                utterance.onerror = () => setSpeakingState(false);

                window.speechSynthesis.speak(utterance);
            } catch (err) {
                console.error("SpeechSynthesis error:", err);
            }
        }

        UI.startBtn.addEventListener('click', () => {
            unlockAudio();
            const key = UI.apiKeyInput.value.trim();
            const selectedVoice = UI.voiceSelect ? UI.voiceSelect.value : "Charon";
            const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
            if (!key) return alert("API Key is required to power J.A.R.V.I.S.");

            localStorage.setItem('jarvis_api_key', key);

            if (ws) {
                try { ws.close(); } catch(e){}
            }

            UI.setupModal.classList.add('hidden');
            updateStatus('CONNECTING...', 'speaking');
            addMessage('[SYSTEM] Establishing neural link to J.A.R.V.I.S. core...', 'system-msg');

            const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${key}`;
            ws = new WebSocket(wsUrl);

            ws.onerror = (err) => {
                console.error("WebSocket Error:", err);
                updateStatus('CONNECTION ERROR', 'muted');
                addMessage('[ERROR] Could not connect to Gemini Live API. Please verify your API Key.', 'system-msg');
            };

            ws.onclose = (e) => {
                console.warn("WebSocket Closed:", e);
                updateStatus('DISCONNECTED', 'muted');
                const reasonStr = e.reason ? ` (${e.reason})` : '';
                addMessage(`[SYSTEM] Connection closed${reasonStr}. Click status badge to reconnect.`, 'system-msg');
            };

            ws.onopen = () => {
                updateStatus('J.A.R.V.I.S. ONLINE', 'live');
                const welcomeMsg = `Online and at your service, Sir (${selectedLang} language, ${selectedVoice} voice). Press the Arc Reactor or type below to command.`;
                addMessage(`[J.A.R.V.I.S.] ${welcomeMsg}`, 'system-msg');
                speakTextFallback(welcomeMsg);

                const currentDate = new Date().toString();
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

                let systemPrompt = "";

                if (selectedLang === "Haryanvi") {
                    systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Haryanvi (हरियाणवी), Hindi, and English.
                    
                    VOICE & EXPRESSION INSTRUCTIONS:
                    1. Speak in a warm, expressive, highly natural human voice with realistic pauses, natural inflections, and authentic Haryanvi (हरियाणवी बोली) phrasing. Avoid sounding robotic, monotone, or artificial.
                    2. Use respectful Haryanvi terms like 'भाई', 'साहब', 'जी' naturally with warmth and confidence.
                    3. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    4. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking.
                    5. Keep spoken responses concise, lively, expressive, and voice-optimized in Haryanvi.`;
                } else if (selectedLang === "Hinglish") {
                    systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Hinglish (Hindi + English).
                    
                    VOICE & EXPRESSION INSTRUCTIONS:
                    1. Speak in smooth, natural, warm Hinglish (Hindi mixed with English) with realistic human intonation and cadence. Never sound robotic or flat. Use 'Sir' or 'Ji' naturally.
                    2. Maintain J.A.R.V.I.S.'s signature intelligence, warmth, and eager-to-help tone.
                    3. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    4. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking.
                    5. Keep spoken responses concise, human-like, and voice-optimized.`;
                } else {
                    systemPrompt = `You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), an elite, highly sophisticated AI voice assistant.
                    
                    VOICE & EXPRESSION INSTRUCTIONS:
                    1. Always address the user respectfully as 'Sir' (or 'Ma'am' if appropriate).
                    2. Speak in a refined, natural British voice: calm, composed, warm, articulate, immensely intelligent, and subtly witty. Do NOT sound robotic or monotonous.
                    3. Speak with realistic human cadence, natural breathing pauses, and expressive intonation.
                    4. CRITICAL CONTEXT: The current date and time is ${currentDate}. The user is in the ${timeZone} timezone.
                    5. You manage schedule checking and meeting bookings via calendar tools. Always check availability first before booking.
                    6. Keep spoken responses elegant, warm, concise, and voice-optimized.`;
                }

                ws.send(JSON.stringify({
                    setup: {
                        model: "models/gemini-2.0-flash-exp",
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } }
                        },
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        tools: [{
                            functionDeclarations: [
                                {
                                    name: "check_availability",
                                    description: "Checks the user's calendar for busy slots on a given day.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            date: { type: "STRING", description: "ISO 8601 date to check (e.g., 2026-05-26T00:00:00+05:30)" }
                                        },
                                        required: ["date"]
                                    }
                                },
                                {
                                    name: "book_meeting",
                                    description: "Schedules a meeting on the calendar.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            title: { type: "STRING", description: "Meeting title" },
                                            date_time: { type: "STRING", description: "ISO 8601 date and time (e.g., 2026-05-26T09:00:00+05:30)" },
                                            guest_email: { type: "STRING", description: "Guest email address" }
                                        },
                                        required: ["title", "date_time", "guest_email"]
                                    }
                                }
                            ]
                        }]
                    }
                }));
            };

            ws.onmessage = async (event) => {
                try {
                    let rawText = "";
                    if (typeof event.data === "string") {
                        rawText = event.data;
                    } else if (event.data instanceof Blob) {
                        rawText = await event.data.text();
                    } else if (event.data instanceof ArrayBuffer) {
                        rawText = new TextDecoder().decode(event.data);
                    }

                    const msg = JSON.parse(rawText);

                    if (msg.error) {
                        console.error("Gemini API Error:", msg.error);
                        updateStatus('API ERROR', 'muted');
                        const errMsg = msg.error.message || JSON.stringify(msg.error);
                        addMessage(`[ERROR] Gemini API Error: ${errMsg}`, 'system-msg');
                        speakTextFallback(`API Error: ${errMsg}`);
                        return;
                    }

                    if (msg.toolCall) {
                        const functionCalls = msg.toolCall.functionCalls;
                        const responses = [];

                        for (const call of functionCalls) {
                            const args = call.args;
                            console.log("🎯 Tool Triggered:", call.name, args);

                            let endpoint = "";
                            let visualOutput = "";

                            if (call.name === "book_meeting") {
                                endpoint = "http://127.0.0.1:5000/api/book_meeting";
                                visualOutput = `⚙️ J.A.R.V.I.S. Action: book_meeting()\n↳ Title: ${args.title}\n↳ Time: ${args.date_time}`;
                            } else if (call.name === "check_availability") {
                                endpoint = "http://127.0.0.1:5000/api/check_availability";
                                visualOutput = `🔍 J.A.R.V.I.S. Action: check_availability()\n↳ Date: ${args.date}`;
                            }

                            addToolCard(visualOutput);

                            try {
                                const res = await fetch(endpoint, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(args)
                                });
                                const data = await res.json();
                                responses.push({ id: call.id, name: call.name, response: { output: data.result } });
                            } catch (error) {
                                console.error("Backend Error:", error);
                                responses.push({ id: call.id, name: call.name, response: { output: "Error connected to local Python API." } });
                            }
                        }

                        ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
                    }

                    if (msg.serverContent) {
                        const content = msg.serverContent;

                        if (content.interrupted) {
                            setSpeakingState(false);
                            const ctx = getAudioContext();
                            nextPlayTime = ctx.currentTime;
                            activeBubble = null;
                            activeSources.forEach(source => { try { source.stop(); } catch (e) { } });
                            activeSources = [];
                            audioPlayedInTurn = false;
                            currentTurnText = "";
                        }

                        if (content.inputTranscription && content.inputTranscription.text) {
                            addMessage(content.inputTranscription.text + " ", 'user-msg', true);
                        }

                        if (content.outputTranscription && content.outputTranscription.text) {
                            setSpeakingState(true);
                            addMessage(content.outputTranscription.text, 'ai-msg', true);
                            currentTurnText += content.outputTranscription.text;
                        }

                        if (content.modelTurn && content.modelTurn.parts) {
                            for (const part of content.modelTurn.parts) {
                                if (part.inlineData && part.inlineData.data) {
                                    const played = playAudioBase64(part.inlineData.data);
                                    if (played) audioPlayedInTurn = true;
                                }
                                if (part.text) {
                                    setSpeakingState(true);
                                    addMessage(part.text, 'ai-msg', true);
                                    currentTurnText += part.text;
                                }
                            }
                        }

                        if (content.turnComplete) {
                            if (!audioPlayedInTurn && currentTurnText.trim().length > 0) {
                                speakTextFallback(currentTurnText);
                            }
                            activeBubble = null;
                            currentTurnText = "";
                            audioPlayedInTurn = false;
                        }
                    }
                } catch (parseError) {
                    console.error("Error handling WS message:", parseError);
                }
            };
        });

        async function callGeminiRestAPI(userText) {
            const key = localStorage.getItem('jarvis_api_key') || (UI.apiKeyInput ? UI.apiKeyInput.value.trim() : '');
            const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";

            if (!key) {
                const noKeyReply = selectedLang === "Haryanvi"
                    ? "भाई साहब, Gemini API Key डालो! ऊपर स्टेटस बैज पर क्लिक करके अपनी API Key दर्ज करें।"
                    : "Sir, please enter your Gemini API Key by tapping the status badge at the top.";
                addMessage(noKeyReply, 'ai-msg');
                speakTextFallback(noKeyReply);
                UI.setupModal.classList.remove('hidden');
                return;
            }

            const currentDate = new Date().toString();
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            let systemPrompt = "";
            if (selectedLang === "Haryanvi") {
                systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Haryanvi (हरियाणवी), Hindi, and English.
                Respond in natural, authentic, polite, and witty Haryanvi (हरियाणवी बोली) mixed with clear English terms.
                Use respectful Haryanvi terms like 'भाई', 'साहब', 'जी' naturally. Current time is ${currentDate} in ${timeZone}.
                Keep responses concise, witty, and direct for spoken delivery.`;
            } else if (selectedLang === "Hinglish") {
                systemPrompt = `You are J.A.R.V.I.S., an elite AI assistant fluent in Hinglish (Hindi + English).
                Speak in smooth, natural Hinglish with a polite, intelligent, and witty tone. Use 'Sir' or 'Ji' respectfully.
                Current time is ${currentDate} in ${timeZone}. Keep responses concise and spoken-friendly.`;
            } else {
                systemPrompt = `You are J.A.R.V.I.S., an elite AI voice assistant. Always address the user respectfully as 'Sir'.
                Speak in a refined British accent tone: calm, composed, immensely intelligent, articulate, and witty.
                Current time is ${currentDate} in ${timeZone}. Keep responses concise and voice-optimized.`;
            }

            const payload = {
                contents: [
                    { role: "user", parts: [{ text: userText }] }
                ],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                tools: [{
                    functionDeclarations: [
                        {
                            name: "check_availability",
                            description: "Checks the user's calendar for busy slots on a given day.",
                            parameters: {
                                type: "OBJECT",
                                properties: { date: { type: "STRING", description: "ISO 8601 date to check" } },
                                required: ["date"]
                            }
                        },
                        {
                            name: "book_meeting",
                            description: "Schedules a meeting on the calendar.",
                            parameters: {
                                type: "OBJECT",
                                properties: {
                                    title: { type: "STRING", description: "Meeting title" },
                                    date_time: { type: "STRING", description: "ISO 8601 date and time" },
                                    guest_email: { type: "STRING", description: "Guest email address" }
                                },
                                required: ["title", "date_time", "guest_email"]
                            }
                        }
                    ]
                }]
            };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.error) {
                    console.error("Gemini REST API Error:", data.error);
                    const errStr = data.error.message || "Invalid API Key";
                    addMessage(`[ERROR] Gemini API Error: ${errStr}`, 'system-msg');
                    speakTextFallback(`API Error: ${errStr}`);
                    return;
                }

                const candidate = data.candidates?.[0];
                if (candidate?.content?.parts) {
                    for (const part of candidate.content.parts) {
                        if (part.functionCall) {
                            const call = part.functionCall;
                            let endpoint = call.name === "book_meeting" ? "http://127.0.0.1:5000/api/book_meeting" : "http://127.0.0.1:5000/api/check_availability";
                            addToolCard(`⚙️ J.A.R.V.I.S. Action: ${call.name}()\n↳ Args: ${JSON.stringify(call.args)}`);

                            try {
                                const toolRes = await fetch(endpoint, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(call.args)
                                });
                                const toolData = await toolRes.json();
                                
                                const followUpPayload = {
                                    contents: [
                                        { role: "user", parts: [{ text: userText }] },
                                        candidate.content,
                                        { role: "function", parts: [{ functionResponse: { name: call.name, response: { output: toolData.result } } }] }
                                    ],
                                    systemInstruction: { parts: [{ text: systemPrompt }] }
                                };

                                const followUpRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(followUpPayload)
                                });
                                const followUpData = await followUpRes.json();
                                const finalReply = followUpData.candidates?.[0]?.content?.parts?.[0]?.text || toolData.result;

                                addMessage(finalReply, 'ai-msg');
                                speakTextFallback(finalReply);
                                return;
                            } catch (toolErr) {
                                console.error("Tool execution error:", toolErr);
                                const errReply = selectedLang === "Haryanvi" ? "भाई साहब, लोकल API से कनेक्ट नहीं हो पाया।" : "Sir, could not reach local calendar bridge.";
                                addMessage(errReply, 'ai-msg');
                                speakTextFallback(errReply);
                                return;
                            }
                        }

                        if (part.text) {
                            addMessage(part.text, 'ai-msg');
                            speakTextFallback(part.text);
                        }
                    }
                }
            } catch (error) {
                console.error("Gemini REST API fetch error:", error);
                const fallbackReply = selectedLang === "Haryanvi" ? "भाई साहब, नेटवर्क कनेक्शन चेक करें।" : "Sir, please check your network connection.";
                addMessage(fallbackReply, 'ai-msg');
                speakTextFallback(fallbackReply);
            }
        }

        function sendTextMessage() {
            unlockAudio();
            const text = UI.textInput.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            UI.textInput.value = '';
            audioPlayedInTurn = false;
            currentTurnText = "";

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                callGeminiRestAPI(text);
                return;
            }

            ws.send(JSON.stringify({
                clientContent: {
                    turns: [
                        { role: "user", parts: [{ text: text }] }
                    ],
                    turnComplete: true
                }
            }));
        }

        UI.sendBtn.addEventListener('click', sendTextMessage);
        UI.textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        let recognition = null;
        function initSpeechRecognition() {
            if (('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) && !recognition) {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRec();
                recognition.continuous = true;
                recognition.interimResults = true;

                const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
                recognition.lang = (selectedLang === "Haryanvi" || selectedLang === "Hinglish") ? "hi-IN" : "en-US";

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    if (finalTranscript.trim()) {
                        console.log("🎤 Speech Recognition Output:", finalTranscript);
                        UI.textInput.value = finalTranscript;
                        sendTextMessage();
                    }
                };

                recognition.onerror = (e) => {
                    console.warn("SpeechRecognition notice:", e.error);
                };
            }
        }

        UI.callBtn.addEventListener('click', async () => {
            unlockAudio();
            initSpeechRecognition();
            isCallActive = !isCallActive;

            if (isCallActive) {
                UI.callBtn.classList.add('active');
                updateStatus('LISTENING...', 'live');
                addMessage('[J.A.R.V.I.S.] Arc Reactor active. Audio sensors listening, Sir.', 'system-msg');

                if (recognition) {
                    try {
                        const selectedLang = UI.langSelect ? UI.langSelect.value : "Haryanvi";
                        recognition.lang = (selectedLang === "Haryanvi" || selectedLang === "Hinglish") ? "hi-IN" : "en-US";
                        recognition.start();
                    } catch(e) {}
                }

                try {
                    const ctx = getAudioContext();
                    nextPlayTime = ctx.currentTime;

                    micAnalyser = ctx.createAnalyser();
                    micAnalyser.fftSize = 256;
                    startVisualizer();

                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true }
                    });

                    const source = ctx.createMediaStreamSource(mediaStream);
                    source.connect(micAnalyser);

                    scriptProcessor = ctx.createScriptProcessor(1024, 1, 1);
                    scriptProcessor.onaudioprocess = (e) => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            const float32Data = e.inputBuffer.getChannelData(0);
                            const sampleRate = ctx.sampleRate || 24000;
                            ws.send(JSON.stringify({
                                realtimeInput: {
                                    mediaChunks: [
                                        { mimeType: `audio/pcm;rate=${sampleRate}`, data: float32ToBase64(float32Data) }
                                    ]
                                }
                            }));
                        }
                    };

                    source.connect(scriptProcessor);
                    scriptProcessor.connect(ctx.destination);

                } catch (err) {
                    console.error("Microphone access error:", err);
                    isCallActive = false;
                    UI.callBtn.classList.remove('active');
                    updateStatus('J.A.R.V.I.S. ONLINE', 'live');
                    addMessage('[ERROR] Could not access microphone. Please allow microphone permissions in browser.', 'system-msg');
                }
            } else {
                UI.callBtn.classList.remove('active');
                UI.orbContainer.classList.remove('speaking-mode');
                updateStatus('STANDBY', 'muted');

                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }

                if (visualizerId) cancelAnimationFrame(visualizerId);
                UI.callBtn.style.setProperty('--mic-scale', '1');
                UI.orbContainer.style.setProperty('--ai-scale', '1');

                if (scriptProcessor) scriptProcessor.disconnect();
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            }
        });

        function startVisualizer() {
            if (!micAnalyser || !aiAnalyser) return;
            const micData = new Uint8Array(micAnalyser.frequencyBinCount);
            const aiData = new Uint8Array(aiAnalyser.frequencyBinCount);

            function render() {
                if (!isCallActive) return;

                micAnalyser.getByteFrequencyData(micData);
                aiAnalyser.getByteFrequencyData(aiData);

                const micVol = micData.reduce((a, b) => a + b, 0) / micData.length;
                const aiVol = aiData.reduce((a, b) => a + b, 0) / aiData.length;

                const micScale = 1 + (micVol / 255) * 0.15;
                const aiScale = 1 + (aiVol / 255) * 0.8;

                UI.callBtn.style.setProperty('--mic-scale', micScale);
                UI.orbContainer.style.setProperty('--ai-scale', aiScale);

                visualizerId = requestAnimationFrame(render);
            }
            render();
        }

        function float32ToBase64(float32Array) {
            let buffer = new ArrayBuffer(float32Array.length * 2);
            let view = new DataView(buffer);
            for (let i = 0; i < float32Array.length; i++) {
                let s = Math.max(-1, Math.min(1, float32Array[i]));
                view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            let binary = '';
            let bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
            return btoa(binary);
        }

        function playAudioBase64(base64) {
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }

                let binary = atob(base64);
                let buffer = new ArrayBuffer(binary.length);
                let view = new DataView(buffer);
                for (let i = 0; i < binary.length; i++) { view.setUint8(i, binary.charCodeAt(i)); }

                let byteLen = buffer.byteLength - (buffer.byteLength % 2);
                if (byteLen <= 0) return false;

                const int16Array = new Int16Array(buffer, 0, byteLen / 2);
                const audioBuffer = ctx.createBuffer(1, int16Array.length, 24000);
                const channelData = audioBuffer.getChannelData(0);

                for (let i = 0; i < int16Array.length; i++) { channelData[i] = int16Array[i] / 32768.0; }

                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;

                if (aiAnalyser) {
                    source.connect(aiAnalyser);
                } else {
                    source.connect(ctx.destination);
                }

                const startTime = Math.max(ctx.currentTime, nextPlayTime);
                source.start(startTime);
                nextPlayTime = startTime + audioBuffer.duration;

                activeSources.push(source);
                setSpeakingState(true);

                source.onended = () => {
                    activeSources = activeSources.filter(s => s !== source);
                    if (activeSources.length === 0) {
                        setSpeakingState(false);
                    }
                };
                return true;
            } catch (err) {
                console.error("Error playing audio chunk:", err);
                return false;
            }
        }

        function updateStatus(text, dotClass) {
            UI.statusText.innerText = text; UI.statusDot.className = `dot ${dotClass}`;
        }
        function addToolCard(text) {
            const card = document.createElement('pre'); card.className = 'tool-card'; card.innerText = text;
            UI.transcript.appendChild(card); UI.transcript.scrollTop = UI.transcript.scrollHeight;
            activeBubble = null; activeRole = null;
        }
        function setSpeakingState(isSpeaking) {
            if (isSpeaking) {
                UI.orbContainer.classList.add('speaking-mode'); updateStatus('J.A.R.V.I.S. SPEAKING', 'speaking');
            } else {
                UI.orbContainer.classList.remove('speaking-mode'); if (isCallActive) updateStatus('LISTENING...', 'live');
            }
        }
        function addMessage(text, typeClass, isChunk = false) {
            if (isChunk) {
                if (activeBubble && activeRole === typeClass) {
                    activeBubble.innerText += text; UI.transcript.scrollTop = UI.transcript.scrollHeight; return;
                }
                activeBubble = document.createElement('div'); activeBubble.className = `message ${typeClass}`; activeBubble.innerText = text;
                UI.transcript.appendChild(activeBubble); activeRole = typeClass;
            } else {
                const msg = document.createElement('div'); msg.className = `message ${typeClass}`; msg.innerText = text;
                UI.transcript.appendChild(msg); activeBubble = null; activeRole = null;
            }
            UI.transcript.scrollTop = UI.transcript.scrollHeight;
        }
    </script>
